{{- range .Values.tenants }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .id }}-secrets
  namespace: {{ .namespace }}
  labels:
    app: multi-tenant-saas
    tenant: {{ .id }}
type: Opaque
data:
  CONFIG_DB_PASSWORD: {{ $.Values.global.configDb.password | b64enc | quote }}
  DB_PASSWORD:        {{ .db.password | b64enc | quote }}
  DB_USER:            {{ .db.user | b64enc | quote }}
  SECRET_KEY:         {{ randAlphaNum 32 | b64enc | quote }}
---
{{- end }}
