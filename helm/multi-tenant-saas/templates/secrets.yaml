{{- range .Values.tenants }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .id }}-secrets
  namespace: {{ .namespace }}
  labels:
    app: multi-tenant-saas
    tenant: {{ .id }}
type: Opaque
data:
  # Config DB admin password (used by app to read tenant registry)
  CONFIG_DB_PASSWORD: {{ $.Values.global.configDb.password | b64enc | quote }}

  # Tenant DB user: default to "<tenant_id>_user" unless overridden in values
  {{- $defaultUser := printf "%s_user" (replace .id "-" "_") }}
  {{- $dbUser := default $defaultUser .db.user }}
  DB_USER: {{ $dbUser | b64enc | quote }}

  # Tenant DB password: default to global configDb.password (admin) unless per-tenant provided
  {{- $dbPass := default $.Values.global.configDb.password .db.password }}
  DB_PASSWORD: {{ $dbPass | b64enc | quote }}

  # App secret key
  SECRET_KEY: {{ randAlphaNum 32 | b64enc | quote }}
---
{{- end }}
