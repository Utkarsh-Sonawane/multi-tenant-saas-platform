{{- range .Values.tenants }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .id }}-config
  namespace: {{ .namespace }}
  labels:
    app: multi-tenant-saas
    tenant: {{ .id }}
data:
  CONFIG_DB_HOST: {{ $.Values.global.configDb.host | quote }}
  CONFIG_DB_PORT: {{ $.Values.global.configDb.port | quote }}
  CONFIG_DB_NAME: {{ $.Values.global.configDb.name | quote }}
  CONFIG_DB_USER: {{ $.Values.global.configDb.user | quote }}
  DB_HOST:        {{ $.Values.global.configDb.host | quote }}
  DB_PORT:        "5432"
  ENVIRONMENT:    {{ $.Values.global.environment | quote }}
  AWS_REGION:     {{ $.Values.global.awsRegion | quote }}
  K8S_NAMESPACE:  {{ .namespace | quote }}
  PORT:           "5000"
  WORKERS:        "4"
  WORKER_CLASS:   "gthread"
  THREADS:        "2"
  TIMEOUT:        "120"
  FLASK_DEBUG:    "false"
---
{{- end }}
