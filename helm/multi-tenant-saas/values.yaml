# ============================================================
# values.yaml — Helm Chart Configuration
#
# Single Helm chart deploys all tenants dynamically from this array.
# ============================================================

global:
  environment: production
  awsRegion: ap-south-1
  image:
    repository: YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/multi-tenant-saas
    tag: latest
    pullPolicy: Always
  configDb:
    host: "your-rds-endpoint.ap-south-1.rds.amazonaws.com"
    port: 5432
    name: config_db
    user: config_user
    password: "CHANGE_ME"  # Set via --set global.configDb.password=xxx

# ── Dynamic Tenants Array ──────────────────────────────────
tenants:
  - id: tenant-a
    namespace: tenant-a
    name: ABC Retail

  - id: tenant-b
    namespace: tenant-b
    name: XYZ Hospital

  - id: tenant-c
    namespace: tenant-c
    name: PQR School

# ── Ingress Configuration ──────────────────────────────────
ingress:
  enabled: true
  host: app.example.com
  certificateArn: "arn:aws:acm:ap-south-1:YOUR_ACCOUNT_ID:certificate/YOUR_CERT_ID"
