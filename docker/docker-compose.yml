# ============================================================
# docker-compose.yml — Local Development Stack
#
# Services:
#   postgres   — PostgreSQL 15 (emulates Amazon RDS)
#   db-init    — Seeds all 4 databases via seed_all.py
#   saas-app   — Flask multi-tenant application
#
# Usage:
#   docker-compose up --build
#   Open: http://localhost:5000/tenant-a
#         http://localhost:5000/tenant-b
#         http://localhost:5000/tenant-c
# ============================================================

networks:
  saas-net:
    driver: bridge

volumes:
  pg-data:

services:

  # ────────────────────────────────────────────────────────────
  # PostgreSQL (all 4 databases on one instance — mirrors RDS)
  # ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - saas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────────────────
  # DB Initialiser — creates & seeds all databases once
  # ────────────────────────────────────────────────────────────
  db-init:
    image: python:3.12-slim
    container_name: saas-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     "5432"
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../database:/database
    working_dir: /database
    command: >
      bash -c "pip install psycopg2-binary -q &&
               python seed_all.py &&
               echo 'DB init complete ✓'"
    networks:
      - saas-net

  # ────────────────────────────────────────────────────────────
  # Flask SaaS Application
  # ────────────────────────────────────────────────────────────
  saas-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: saas-app
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      # Config DB
      CONFIG_DB_HOST:     postgres
      CONFIG_DB_PORT:     "5432"
      CONFIG_DB_NAME:     config_db
      CONFIG_DB_USER:     postgres
      CONFIG_DB_PASSWORD: postgres

      # Tenant DB (same host; db_name comes from config_db per tenant)
      DB_HOST:     postgres
      DB_PORT:     "5432"
      DB_USER:     postgres
      DB_PASSWORD: postgres

      # App settings
      SECRET_KEY:   local-dev-secret-change-in-prod
      FLASK_DEBUG:  "false"
      ENVIRONMENT:  development
      AWS_REGION:   ap-south-1
      K8S_NAMESPACE: local
      PORT:         "5000"
      WORKERS:      "2"
    networks:
      - saas-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
