name: Deploy Multi-Tenant SaaS to EKS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/deploy-eks-app.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Target AWS environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

      image_tag:
        description: Docker image tag. Leave empty to use Git SHA.
        required: false
        default: ''

permissions:
  id-token: write
  contents: write

jobs:

  deploy:
    name: Build and Deploy to EKS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_REGION: ap-south-1
      ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      CLUSTER_NAME: EKS_cluster

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. AWS OIDC AUTHENTICATION
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # 3. READ AWS CONFIGURATION FROM SSM
      # ==========================================================

      - name: Read application configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Reading ECR URL..."

          ECR_URL=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/ecr_url" \
            --query "Parameter.Value" \
            --output text)

          echo "Reading RDS endpoint..."

          RDS_ENDPOINT=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/rds_endpoint" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          echo "Reading RDS password..."

          RDS_PASSWORD=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/rds_password" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          if [ -z "${ECR_URL}" ]; then
            echo "ERROR: ECR_URL is empty"
            exit 1
          fi

          if [ -z "${RDS_ENDPOINT}" ]; then
            echo "ERROR: RDS_ENDPOINT is empty"
            exit 1
          fi

          if [ -z "${RDS_PASSWORD}" ]; then
            echo "ERROR: RDS_PASSWORD is empty"
            exit 1
          fi

          {
            echo "ECR_URL=${ECR_URL}"
            echo "RDS_ENDPOINT=${RDS_ENDPOINT}"
            echo "RDS_PASSWORD=${RDS_PASSWORD}"
          } >> "${GITHUB_ENV}"

          echo "Configuration loaded successfully."


      # ==========================================================
      # 4. LOGIN TO ECR
      # ==========================================================

      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password \
            --region "${AWS_REGION}" \
          | docker login \
              --username AWS \
              --password-stdin "${ECR_URL}"

          echo "ECR login successful."


      # ==========================================================
      # 5. BUILD APPLICATION IMAGE
      # ==========================================================

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ECR_URL}:${IMAGE_TAG}"

          echo "Building:"
          echo "${IMAGE}"

          docker build \
            -f docker/Dockerfile \
            -t "${IMAGE}" \
            .

          echo "Docker image built successfully."


      # ==========================================================
      # 6. PUSH IMAGE TO ECR
      # ==========================================================

      - name: Push Docker image to ECR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ECR_URL}:${IMAGE_TAG}"
          LATEST="${ECR_URL}:latest"

          docker push "${IMAGE}"

          docker tag "${IMAGE}" "${LATEST}"

          docker push "${LATEST}"

          echo "Images pushed successfully."


      # ==========================================================
      # 7. CONNECT TO EKS
      # ==========================================================

      - name: Connect to EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "${CLUSTER_NAME}" \
            --region "${AWS_REGION}"

          echo "Connected to EKS."

          kubectl cluster-info

          echo "Current nodes:"
          kubectl get nodes || true


      # ==========================================================
      # 8. CREATE TENANT NAMESPACES
      # ==========================================================

      - name: Create tenant namespaces
        shell: bash
        run: |
          set -euo pipefail

          for TENANT in tenant-a tenant-b tenant-c; do

            echo "Creating/updating namespace: ${TENANT}"

            kubectl create namespace "${TENANT}" \
              --dry-run=client \
              -o yaml \
            | kubectl apply -f -

          done

          echo "Namespaces:"
          kubectl get namespaces


      # ==========================================================
      # 9. CREATE / UPDATE TENANT SECRETS
      # ==========================================================

      - name: Create tenant secrets
        shell: bash
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${APP_SECRET_KEY}" ]; then
            echo "ERROR: APP_SECRET_KEY GitHub secret is not configured."
            exit 1
          fi

          for TENANT in tenant-a tenant-b tenant-c; do

            echo "Updating secret for ${TENANT}"

            kubectl create secret generic "${TENANT}-secrets" \
              --namespace "${TENANT}" \
              --from-literal=CONFIG_DB_PASSWORD="${RDS_PASSWORD}" \
              --from-literal=DB_PASSWORD="${RDS_PASSWORD}" \
              --from-literal=DB_USER="postgres" \
              --from-literal=SECRET_KEY="${APP_SECRET_KEY}" \
              --dry-run=client \
              -o yaml \
            | kubectl apply -f -

          done

          echo "Tenant secrets successfully configured."


      # ==========================================================
      # 10. UPDATE KUBERNETES MANIFESTS
      # ==========================================================

      - name: Update Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          NEW_IMAGE="${ECR_URL}:${IMAGE_TAG}"

          echo "Application image:"
          echo "${NEW_IMAGE}"

          echo "RDS endpoint:"
          echo "${RDS_ENDPOINT}"

          for TENANT in tenant-a tenant-b tenant-c; do

            echo "Updating ${TENANT} manifests..."

            sed -i \
              "s|image: .*|image: ${NEW_IMAGE}|g" \
              "kubernetes/${TENANT}/deployment.yaml"

            sed -i \
              "s|CONFIG_DB_HOST: .*|CONFIG_DB_HOST: \"${RDS_ENDPOINT}\"|g" \
              "kubernetes/${TENANT}/configmap.yaml"

            sed -i \
              "s|DB_HOST: .*|DB_HOST: \"${RDS_ENDPOINT}\"|g" \
              "kubernetes/${TENANT}/configmap.yaml"

          done

          echo "Manifest update completed."


      # ==========================================================
      # 11. DEPLOY KUBERNETES RESOURCES
      # ==========================================================

      - name: Deploy application to Kubernetes
        shell: bash
        run: |
          set -euo pipefail

          chmod +x kubernetes/deploy.sh

          echo "Running Kubernetes deployment script..."

          ./kubernetes/deploy.sh

          echo "Kubernetes resources applied successfully."


      # ==========================================================
      # 12. WAIT FOR TENANT A
      # ==========================================================

      - name: Wait for Tenant A rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status \
            deployment/tenant-a-app \
            -n tenant-a \
            --timeout=10m


      # ==========================================================
      # 13. WAIT FOR TENANT B
      # ==========================================================

      - name: Wait for Tenant B rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status \
            deployment/tenant-b-app \
            -n tenant-b \
            --timeout=10m


      # ==========================================================
      # 14. WAIT FOR TENANT C
      # ==========================================================

      - name: Wait for Tenant C rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status \
            deployment/tenant-c-app \
            -n tenant-c \
            --timeout=10m


      # ==========================================================
      # 15. VERIFY DEPLOYMENT
      # ==========================================================

      - name: Verify Kubernetes resources
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "======================================================"
          echo " DEPLOYMENT VERIFICATION"
          echo "======================================================"

          echo ""
          echo "=== Namespaces ==="
          kubectl get namespaces

          echo ""
          echo "=== Deployments ==="
          kubectl get deployments -A

          echo ""
          echo "=== Pods ==="
          kubectl get pods -A -o wide

          echo ""
          echo "=== Services ==="
          kubectl get services -A

          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -A

          echo ""
          echo "=== EKS Nodes ==="
          kubectl get nodes

          echo ""
          echo "======================================================"
          echo " Kubernetes deployment verification completed."
          echo "======================================================"


      # ==========================================================
      # 16. SHOW ALB ADDRESS
      # ==========================================================

      - name: Wait for ALB address
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for AWS ALB address..."

          for i in {1..30}; do

            ALB=$(kubectl get ingress \
              -n tenant-a \
              multi-tenant-saas-ingress \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "${ALB}" ]; then
              echo ""
              echo "======================================================"
              echo " APPLICATION IS LIVE"
              echo "======================================================"
              echo ""
              echo "ALB:"
              echo "${ALB}"
              echo ""
              echo "Tenant A:"
              echo "http://${ALB}/tenant-a"
              echo ""
              echo "Tenant B:"
              echo "http://${ALB}/tenant-b"
              echo ""
              echo "Tenant C:"
              echo "http://${ALB}/tenant-c"
              echo ""
              echo "======================================================"
              exit 0
            fi

            echo "ALB not ready yet. Attempt ${i}/30..."
            sleep 10

          done

          echo "ALB address not available yet."
          echo "Kubernetes resources were deployed, but ALB provisioning is still pending."

          kubectl get ingress -A

      # ==========================================================
      # 17. COMMIT MANIFEST CHANGES
      # ==========================================================

      - name: Commit deployment manifest changes
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add kubernetes/

          if git diff --cached --quiet; then

            echo "No Kubernetes manifest changes to commit."

          else

            git commit \
              -m "ci: deploy ${IMAGE_TAG} to ${ENVIRONMENT} [skip ci]"

            git push

          fi

          echo "Pipeline completed successfully."
