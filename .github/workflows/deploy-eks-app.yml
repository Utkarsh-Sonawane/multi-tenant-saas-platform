name: Deploy Multi-Tenant SaaS to EKS via Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/deploy-eks-app.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Target AWS environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: Container image tag to deploy. Defaults to Git SHA.
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_REGION: ap-south-1
      ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      CLUSTER_NAME: EKS_cluster
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read application configuration from AWS SSM Parameter Store
        id: ssm
        shell: bash
        run: |
          set -euo pipefail

          ECR_URL=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/ecr_url" \
            --query "Parameter.Value" \
            --output text)

          RDS_ENDPOINT=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/rds_endpoint" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          RDS_PASSWORD=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/rds_password" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          {
            echo "ECR_URL=${ECR_URL}"
            echo "RDS_ENDPOINT=${RDS_ENDPOINT}"
            echo "RDS_PASSWORD=${RDS_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Authenticate Docker to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_URL}"

      - name: Build and push application image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ECR_URL}:${IMAGE_TAG}"
          LATEST="${ECR_URL}:latest"

          docker build -f docker/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          docker tag "${IMAGE}" "${LATEST}"
          docker push "${LATEST}"

      - name: Update kubeconfig for EKS
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --dry-run=client -f kubernetes/namespaces.yaml
          kubectl apply --dry-run=client -f kubernetes/tenant-a/
          kubectl apply --dry-run=client -f kubernetes/tenant-b/
          kubectl apply --dry-run=client -f kubernetes/tenant-c/
          kubectl apply --dry-run=client -f kubernetes/ingress-alb.yaml

      - name: Deploy Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          test -n "${APP_SECRET_KEY}" || { echo "APP_SECRET_KEY repository secret is required"; exit 1; }

          kubectl apply -f kubernetes/namespaces.yaml

          for TENANT in tenant-a tenant-b tenant-c; do
            kubectl create configmap "${TENANT}-config" \
              --namespace "${TENANT}" \
              --from-literal=CONFIG_DB_HOST="${RDS_ENDPOINT}" \
              --from-literal=CONFIG_DB_PORT=5432 \
              --from-literal=CONFIG_DB_NAME=config_db \
              --from-literal=CONFIG_DB_USER=postgres \
              --from-literal=DB_HOST="${RDS_ENDPOINT}" \
              --from-literal=DB_PORT=5432 \
              --from-literal=ENVIRONMENT="${ENVIRONMENT}" \
              --from-literal=AWS_REGION="${AWS_REGION}" \
              --from-literal=K8S_NAMESPACE="${TENANT}" \
              --from-literal=PORT=5000 \
              --from-literal=WORKERS=4 \
              --from-literal=WORKER_CLASS=gthread \
              --from-literal=THREADS=2 \
              --from-literal=TIMEOUT=120 \
              --from-literal=FLASK_DEBUG=false \
              --dry-run=client -o yaml | kubectl apply -f -

            TENANT_USER="${TENANT//-/_}_user"
            kubectl create secret generic "${TENANT}-secrets" \
              --namespace "${TENANT}" \
              --from-literal=CONFIG_DB_PASSWORD="${RDS_PASSWORD}" \
              --from-literal=DB_PASSWORD="${RDS_PASSWORD}" \
              --from-literal=DB_USER="${TENANT_USER}" \
              --from-literal=SECRET_KEY="${APP_SECRET_KEY}" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

          kubectl apply -f kubernetes/tenant-a/deployment.yaml -f kubernetes/tenant-a/service.yaml
          kubectl apply -f kubernetes/tenant-b/deployment.yaml -f kubernetes/tenant-b/service.yaml
          kubectl apply -f kubernetes/tenant-c/deployment.yaml -f kubernetes/tenant-c/service.yaml

          for TENANT in tenant-a tenant-b tenant-c; do
            kubectl -n "${TENANT}" set image deployment/"${TENANT}-app" \
              saas-app="${ECR_URL}:${IMAGE_TAG}"
          done

          kubectl apply -f kubernetes/ingress-alb.yaml

          for TENANT in tenant-a tenant-b tenant-c; do
            kubectl rollout status deployment/"${TENANT}-app" -n "${TENANT}" --timeout=180s
          done

      - name: Verify deployment status
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods -A -l app=multi-tenant-saas
          kubectl get svc,ingress -A -l app=multi-tenant-saas
