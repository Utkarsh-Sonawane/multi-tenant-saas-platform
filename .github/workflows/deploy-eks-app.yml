name: Deploy Multi-Tenant SaaS to EKS via Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/deploy-eks-app.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Target AWS environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: Container image tag to deploy. Defaults to Git SHA.
        required: false
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_REGION: ap-south-1
      ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      CLUSTER_NAME: EKS_cluster
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Read configuration from SSM
      # --------------------------------------------------
      - name: Read application configuration from AWS SSM Parameter Store
        shell: bash
        run: |
          set -euo pipefail

          ECR_URL=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/ecr_url" \
            --query "Parameter.Value" \
            --output text)

          RDS_ENDPOINT=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/rds_endpoint" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          RDS_PASSWORD=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/rds_password" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          {
            echo "ECR_URL=${ECR_URL}"
            echo "RDS_ENDPOINT=${RDS_ENDPOINT}"
            echo "RDS_PASSWORD=${RDS_PASSWORD}"
          } >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. Login to ECR
      # --------------------------------------------------
      - name: Authenticate Docker to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password \
            --region "${AWS_REGION}" \
            | docker login \
              --username AWS \
              --password-stdin "${ECR_URL}"

      # --------------------------------------------------
      # 5. Build and push Docker image
      # --------------------------------------------------
      - name: Build and push application image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${ECR_URL}:${IMAGE_TAG}"
          LATEST="${ECR_URL}:latest"

          docker build \
            -f docker/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

          docker tag "${IMAGE}" "${LATEST}"
          docker push "${LATEST}"

      # --------------------------------------------------
      # 6. Connect to EKS
      # --------------------------------------------------
      - name: Connect to EKS Cluster
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "${CLUSTER_NAME}" \
            --region "${AWS_REGION}"

          kubectl get nodes

      # --------------------------------------------------
      # 7. Create tenant namespaces
      # --------------------------------------------------
      - name: Create tenant namespaces
        shell: bash
        run: |
          set -euo pipefail

          for TENANT in tenant-a tenant-b tenant-c; do

            kubectl create namespace "${TENANT}" \
              --dry-run=client \
              -o yaml | kubectl apply -f -

          done

          echo "Tenant namespaces created successfully."

      # --------------------------------------------------
      # 8. Create/update tenant secrets
      # --------------------------------------------------
      - name: Inject Secrets directly into EKS
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          for TENANT in tenant-a tenant-b tenant-c; do

            kubectl create secret generic "${TENANT}-secrets" \
              --namespace "${TENANT}" \
              --from-literal=CONFIG_DB_PASSWORD="${RDS_PASSWORD}" \
              --from-literal=DB_PASSWORD="${RDS_PASSWORD}" \
              --from-literal=DB_USER="postgres" \
              --from-literal=SECRET_KEY="${APP_SECRET_KEY}" \
              --dry-run=client \
              -o yaml | kubectl apply -f -

          done

          echo "Tenant secrets created/updated successfully."

      # --------------------------------------------------
      # 9. Update Kubernetes manifests
      # --------------------------------------------------
      - name: Update deployment manifests in Git
        shell: bash
        run: |
          set -euo pipefail

          NEW_IMAGE="${ECR_URL}:${IMAGE_TAG}"

          for TENANT in tenant-a tenant-b tenant-c; do

            sed -i \
              "s|image: .*|image: ${NEW_IMAGE}|g" \
              "kubernetes/${TENANT}/deployment.yaml"

            sed -i \
              "s|CONFIG_DB_HOST: .*|CONFIG_DB_HOST: \"${RDS_ENDPOINT}\"|g" \
              "kubernetes/${TENANT}/configmap.yaml"

            sed -i \
              "s|DB_HOST: .*|DB_HOST: \"${RDS_ENDPOINT}\"|g" \
              "kubernetes/${TENANT}/configmap.yaml"

          done

      # --------------------------------------------------
      # 10. Commit manifest changes
      # --------------------------------------------------
      - name: Commit and push Kubernetes manifest changes
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add kubernetes/

          if ! git diff-index --quiet HEAD; then

            git commit \
              -m "ci: update tenant image tag to ${IMAGE_TAG} [skip ci]"

            git push

          else

            echo "No manifest changes detected."

          fi
