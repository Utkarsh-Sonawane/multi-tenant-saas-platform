name: Deploy Multi-Tenant SaaS to EKS via Helm

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'helm/**'
      - '.github/workflows/deploy-eks-app.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Target AWS environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: Container image tag to deploy. Defaults to Git SHA.
        required: false
        default: ''
      helm_action:
        description: Helm action to execute
        required: true
        default: upgrade
        type: choice
        options:
          - install
          - upgrade

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_REGION: ap-south-1
      ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      CLUSTER_NAME: multi-tenant-eks-cluster
      HELM_RELEASE: multi-tenant-saas
      HELM_CHART_PATH: ./helm/multi-tenant-saas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Read application configuration from AWS SSM Parameter Store
        id: ssm
        shell: bash
        run: |
          set -euo pipefail

          ECR_URL=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/ecr_url" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          RDS_ENDPOINT=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/rds_endpoint" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          RDS_PASSWORD=$(aws ssm get-parameter \
            --name "/myapp/${ENVIRONMENT}/rds_password" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"
          echo "rds_endpoint=${RDS_ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "rds_password=${RDS_PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Authenticate Docker to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${{ steps.ssm.outputs.ecr_url }}"

      - name: Build and push application image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.ssm.outputs.ecr_url }}:${IMAGE_TAG}"
          LATEST="${{ steps.ssm.outputs.ecr_url }}:latest"

          docker build -f docker/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          docker tag "${IMAGE}" "${LATEST}"
          docker push "${LATEST}"

      - name: Update kubeconfig for EKS
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Lint Helm chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint "${HELM_CHART_PATH}"

      - name: Generate Helm override values
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/multi-tenant-values.yaml <<EOF
          global:
            environment: "${ENVIRONMENT}"
            awsRegion: "${AWS_REGION}"
            image:
              repository: "${{ steps.ssm.outputs.ecr_url }}"
              tag: "${IMAGE_TAG}"
              pullPolicy: Always
            configDb:
              host: "${{ steps.ssm.outputs.rds_endpoint }}"
              port: 5432
              name: "config_db"
              user: "postgres"
              password: "${{ steps.ssm.outputs.rds_password }}"

          ingress:
            enabled: true
            host: "app.${ENVIRONMENT}.example.com"
            certificateArn: "${{ steps.ssm.outputs.cert_arn }}"

          tenants:
            - id: tenant-a
              name: "ABC Retail"
              namespace: tenant-a
              replicas: 2
              db:
                name: tenant_a_db
                user: tenant_a_user
                password: "${{ steps.ssm.outputs.rds_password }}"
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

            - id: tenant-b
              name: "XYZ Hospital"
              namespace: tenant-b
              replicas: 2
              db:
                name: tenant_b_db
                user: tenant_b_user
                password: "${{ steps.ssm.outputs.rds_password }}"
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

            - id: tenant-c
              name: "PQR School"
              namespace: tenant-c
              replicas: 2
              db:
                name: tenant_c_db
                user: tenant_c_user
                password: "${{ steps.ssm.outputs.rds_password }}"
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          EOF

      - name: Deploy application with Helm
        shell: bash
        run: |
          set -euo pipefail

          ACTION="${{ github.event.inputs.helm_action || 'upgrade' }}"

          if [ "${ACTION}" = "install" ]; then
            helm install "${HELM_RELEASE}" "${HELM_CHART_PATH}" \
              --namespace tenant-a \
              --create-namespace \
              -f /tmp/multi-tenant-values.yaml \
              --wait \
              --timeout 10m \
              --atomic \
              --cleanup-on-fail
          else
            helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART_PATH}" \
              --namespace tenant-a \
              --create-namespace \
              -f /tmp/multi-tenant-values.yaml \
              --wait \
              --timeout 10m \
              --atomic \
              --cleanup-on-fail
          fi

      - name: Verify deployment status
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods -A -l app=multi-tenant-saas
          kubectl get ingress -A
          kubectl rollout status deployment/tenant-a-app -n tenant-a --timeout=180s
          kubectl rollout status deployment/tenant-b-app -n tenant-b --timeout=180s
          kubectl rollout status deployment/tenant-c-app -n tenant-c --timeout=180s
