name: Build and deploy application

on:
  push:
    branches: [main]
    paths: [backend/**, frontend/**, database/**, docker/**, kubernetes/**, .github/workflows/application-deploy.yml]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: EKS_cluster
  ECR_REPOSITORY: multi-tenant-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::096563427919:role/app-tenant
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push immutable images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
          docker build -f docker/Dockerfile.bootstrap -t "$REGISTRY/$ECR_REPOSITORY:bootstrap-$TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:bootstrap-$TAG"
      - name: Configure kubectl and install External Secrets Operator
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          helm repo add external-secrets https://charts.external-secrets.io
          helm upgrade --install external-secrets external-secrets/external-secrets --namespace external-secrets --create-namespace
          kubectl rollout status deployment/external-secrets -n external-secrets --timeout=180s
      - name: Apply secret synchronization and bootstrap database
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          cd terraform/environments/prod
          BOOTSTRAP_ROLE=$(terraform output -raw bootstrap_ssm_role_arn)
          TENANT_A_ROLE=$(terraform output -raw tenant_a_ssm_role_arn)
          TENANT_B_ROLE=$(terraform output -raw tenant_b_ssm_role_arn)
          TENANT_C_ROLE=$(terraform output -raw tenant_c_ssm_role_arn)
          cd ../../..
          sed -i "s|REPLACE_WITH_BOOTSTRAP_IRSA_ROLE_ARN|$BOOTSTRAP_ROLE|g; s|REPLACE_WITH_TENANT_A_IRSA_ROLE_ARN|$TENANT_A_ROLE|g; s|REPLACE_WITH_TENANT_B_IRSA_ROLE_ARN|$TENANT_B_ROLE|g; s|REPLACE_WITH_TENANT_C_IRSA_ROLE_ARN|$TENANT_C_ROLE|g; s|REPLACE_WITH_ECR_URI:bootstrap|$REGISTRY/$ECR_REPOSITORY:bootstrap-$TAG|g" kubernetes/bootstrap/*.yaml kubernetes/tenant-*/secret.yaml
          kubectl apply -f kubernetes/namespaces.yaml
          kubectl apply -f kubernetes/bootstrap/serviceaccount.yaml -f kubernetes/bootstrap/configmap.yaml -f kubernetes/bootstrap/external-secret.yaml
          kubectl apply -f kubernetes/tenant-a/secret.yaml -f kubernetes/tenant-b/secret.yaml -f kubernetes/tenant-c/secret.yaml
          kubectl wait --for=condition=Ready externalsecret/db-bootstrap-credentials -n tenant-a --timeout=120s
          kubectl delete job db-bootstrap -n tenant-a --ignore-not-found
          kubectl apply -f kubernetes/bootstrap/job.yaml
          kubectl wait --for=condition=complete job/db-bootstrap -n tenant-a --timeout=10m
      - name: Deploy tenant applications
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          sed -i "s|YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/multi-tenant-saas:latest|$REGISTRY/$ECR_REPOSITORY:$TAG|g" kubernetes/tenant-*/deployment.yaml
          kubectl apply -f kubernetes/tenant-a/ -f kubernetes/tenant-b/ -f kubernetes/tenant-c/
          kubectl rollout status deployment/tenant-a-app -n tenant-a --timeout=180s
          kubectl rollout status deployment/tenant-b-app -n tenant-b --timeout=180s
          kubectl rollout status deployment/tenant-c-app -n tenant-c --timeout=180s
