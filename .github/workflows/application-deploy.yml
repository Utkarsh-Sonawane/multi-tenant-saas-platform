name: Build and deploy application

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - 'docker/**'
      - 'kubernetes/**'
      - 'terraform/**'
      - '.github/workflows/application-deploy.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: EKS_cluster
  ECR_REPOSITORY: multi-tenant-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. AWS OIDC authentication
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::096563427919:role/app-tenant
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Install Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # --------------------------------------------------
      # 4. Initialize Terraform
      # --------------------------------------------------
      - name: Initialize Terraform
        working-directory: terraform/environments/prod
        run: terraform init

      # --------------------------------------------------
      # 5. Login to ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # --------------------------------------------------
      # 6. Build and push immutable application images
      # --------------------------------------------------
      - name: Build and push immutable images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker build \
            -f docker/Dockerfile \
            -t "$REGISTRY/$ECR_REPOSITORY:$TAG" \
            .

          docker build \
            -f docker/Dockerfile.bootstrap \
            -t "$REGISTRY/$ECR_REPOSITORY:bootstrap-$TAG" \
            .

          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:bootstrap-$TAG"

      # --------------------------------------------------
      # 7. Configure kubectl + External Secrets
      # --------------------------------------------------
      - name: Configure kubectl and install External Secrets Operator
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

          helm repo add external-secrets \
            https://charts.external-secrets.io

          helm repo update

          helm upgrade --install external-secrets \
            external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --wait \
            --timeout 5m

          kubectl rollout status \
            deployment/external-secrets \
            -n external-secrets \
            --timeout=180s

      # --------------------------------------------------
      # 8. Get Terraform IAM role outputs
      # --------------------------------------------------
      - name: Get Terraform IAM role outputs
        id: terraform-outputs
        working-directory: terraform/environments/prod
        shell: bash
        run: |
          set -euo pipefail

          BOOTSTRAP_ROLE=$(terraform output -raw bootstrap_ssm_role_arn)
          TENANT_A_ROLE=$(terraform output -raw tenant_a_ssm_role_arn)
          TENANT_B_ROLE=$(terraform output -raw tenant_b_ssm_role_arn)
          TENANT_C_ROLE=$(terraform output -raw tenant_c_ssm_role_arn)

          echo "::add-mask::$BOOTSTRAP_ROLE"
          echo "::add-mask::$TENANT_A_ROLE"
          echo "::add-mask::$TENANT_B_ROLE"
          echo "::add-mask::$TENANT_C_ROLE"

          echo "bootstrap_role=$BOOTSTRAP_ROLE" >> "$GITHUB_OUTPUT"
          echo "tenant_a_role=$TENANT_A_ROLE" >> "$GITHUB_OUTPUT"
          echo "tenant_b_role=$TENANT_B_ROLE" >> "$GITHUB_OUTPUT"
          echo "tenant_c_role=$TENANT_C_ROLE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 9. Apply External Secrets + bootstrap database
      # --------------------------------------------------
      - name: Apply secret synchronization and bootstrap database
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          BOOTSTRAP_ROLE: ${{ steps.terraform-outputs.outputs.bootstrap_role }}
          TENANT_A_ROLE: ${{ steps.terraform-outputs.outputs.tenant_a_role }}
          TENANT_B_ROLE: ${{ steps.terraform-outputs.outputs.tenant_b_role }}
          TENANT_C_ROLE: ${{ steps.terraform-outputs.outputs.tenant_c_role }}
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            "s|REPLACE_WITH_BOOTSTRAP_IRSA_ROLE_ARN|$BOOTSTRAP_ROLE|g;
             s|REPLACE_WITH_TENANT_A_IRSA_ROLE_ARN|$TENANT_A_ROLE|g;
             s|REPLACE_WITH_TENANT_B_IRSA_ROLE_ARN|$TENANT_B_ROLE|g;
             s|REPLACE_WITH_TENANT_C_IRSA_ROLE_ARN|$TENANT_C_ROLE|g;
             s|REPLACE_WITH_ECR_URI:bootstrap|$REGISTRY/$ECR_REPOSITORY:bootstrap-$TAG|g" \
            kubernetes/bootstrap/*.yaml \
            kubernetes/tenant-*/secret.yaml

          kubectl apply \
            -f kubernetes/namespaces.yaml

          kubectl apply \
            -f kubernetes/bootstrap/serviceaccount.yaml \
            -f kubernetes/bootstrap/configmap.yaml \
            -f kubernetes/bootstrap/external-secret.yaml

          kubectl apply \
            -f kubernetes/tenant-a/secret.yaml \
            -f kubernetes/tenant-b/secret.yaml \
            -f kubernetes/tenant-c/secret.yaml

          kubectl wait \
            --for=condition=Ready \
            externalsecret/db-bootstrap-credentials \
            -n tenant-a \
            --timeout=120s

          kubectl delete job db-bootstrap \
            -n tenant-a \
            --ignore-not-found

          kubectl apply \
            -f kubernetes/bootstrap/job.yaml

          kubectl wait \
            --for=condition=complete \
            job/db-bootstrap \
            -n tenant-a \
            --timeout=10m

      # --------------------------------------------------
      # 10. Deploy tenant applications
      # --------------------------------------------------
      - name: Deploy tenant applications
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for file in kubernetes/tenant-*/deployment.yaml; do
            sed -i \
              "s|YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/multi-tenant-saas:latest|$REGISTRY/$ECR_REPOSITORY:$TAG|g" \
              "$file"
          done

          kubectl apply -f kubernetes/tenant-a/
          kubectl apply -f kubernetes/tenant-b/
          kubectl apply -f kubernetes/tenant-c/

          kubectl rollout status \
            deployment/tenant-a-app \
            -n tenant-a \
            --timeout=180s

          kubectl rollout status \
            deployment/tenant-b-app \
            -n tenant-b \
            --timeout=180s

          kubectl rollout status \
            deployment/tenant-c-app \
            -n tenant-c \
            --timeout=180s