{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block body %}
<div class="error-page d-flex align-items-center justify-content-center min-vh-100">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="text-center error-content">
    <div class="error-code">404</div>
    <h2 class="fw-bold text-white mb-2">Page Not Found</h2>
    <p class="text-white-50 mb-4">
      The page or tenant you're looking for doesn't exist or is inactive.
    </p>
    {% if tenant_id and tenant %}
    <a href="{{ url_for('dashboard', tenant_id=tenant_id) }}" class="btn btn-primary-tenant px-4">
      <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
    </a>
    {% else %}
    <a href="/login" class="btn btn-primary-tenant px-4">
      <i class="bi bi-box-arrow-in-right me-2"></i>Go to Login
    </a>
    {% endif %}
    <div class="mt-4">
      <div class="error-illustration mx-auto">
        <i class="bi bi-compass fs-1 text-white-25 spin-slow"></i>
      </div>
    </div>
  </div>
</div>
{% endblock %}
