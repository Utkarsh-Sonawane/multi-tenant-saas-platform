# ============================================================
# tenant-a/configmap.yaml — Non-sensitive config for Tenant A
# Namespace: tenant-a
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-a-config
  namespace: tenant-a
  labels:
    app: multi-tenant-saas
    tenant: tenant-a
data:
  # ── Config DB (shared registry) ──────────────────────────
  CONFIG_DB_PORT: "5432"
  CONFIG_DB_NAME: "config_db"
  CONFIG_DB_USER: "config_user"

  # ── Tenant-specific DB ───────────────────────────────────
  DB_PORT: "5432"
  DEPLOYED_TENANT_ID: "tenant-a"

  # ── Application settings ─────────────────────────────────
  ENVIRONMENT:    "production"
  AWS_REGION:     "ap-south-1"
  K8S_NAMESPACE:  "tenant-a"
  PORT:           "5000"
  WORKERS:        "4"
  WORKER_CLASS:   "gthread"
  THREADS:        "2"
  TIMEOUT:        "120"
  FLASK_DEBUG:    "false"
