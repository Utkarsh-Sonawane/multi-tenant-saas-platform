# ============================================================
# tenant-a/secret.yaml — Sensitive credentials for Tenant A
# Namespace: tenant-a
#
# IMPORTANT: In production, use AWS Secrets Manager with the
#            External Secrets Operator instead of raw secrets.
#            These are base64 encoded (NOT encrypted).
#
# Encode: echo -n "value" | base64
# Decode: echo "dmFsdWU=" | base64 -d
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: tenant-a-secrets
  namespace: tenant-a
  labels:
    app: multi-tenant-saas
    tenant: tenant-a
  annotations:
    # If using External Secrets Operator with AWS Secrets Manager:
    # externalsecrets.io/secret-manager: "aws"
type: Opaque
data:
  # base64 encoded values — replace with real encoded secrets
  # echo -n "your-actual-password" | base64
  CONFIG_DB_PASSWORD: Y0hBTkdFX01F         # CHANGE_ME
  DB_PASSWORD:        Y0hBTkdFX01F         # CHANGE_ME
  DB_USER:            dGVuYW50X2FfdXNlcg== # tenant_a_user
  SECRET_KEY:         Y0hBTkdFX01FX1RPS0VO # CHANGE_ME_TOKEN
