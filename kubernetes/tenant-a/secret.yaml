# ============================================================
# tenant-a/secret.yaml — Sensitive credentials for Tenant A
# Namespace: tenant-a
#
# IMPORTANT: In production, use AWS Secrets Manager with the
#            External Secrets Operator instead of raw secrets.
#            These are base64 encoded (NOT encrypted).
#
# Encode: echo -n "value" | base64
# Decode: echo "dmFsdWU=" | base64 -d
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-a-secrets-reader
  namespace: tenant-a
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_TENANT_A_IRSA_ROLE_ARN
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: tenant-a-parameter-store, namespace: tenant-a}
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
      auth: {jwt: {serviceAccountRef: {name: tenant-a-secrets-reader}}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: tenant-a-runtime, namespace: tenant-a}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: tenant-a-parameter-store, kind: SecretStore}
  target: {name: tenant-a-secrets, creationPolicy: Owner}
  data:
    - secretKey: CONFIG_DB_HOST
      remoteRef: {key: /myapp/prod/rds_endpoint}
    - secretKey: CONFIG_DB_PASSWORD
      remoteRef: {key: /multi-tenant/prod/config-db/password}
    - secretKey: DB_HOST
      remoteRef: {key: /myapp/prod/rds_endpoint}
    - secretKey: DB_USER
      remoteRef: {key: /multi-tenant/prod/tenant-a/db/username}
    - secretKey: DB_PASSWORD
      remoteRef: {key: /multi-tenant/prod/tenant-a/db/password}
    - secretKey: SECRET_KEY
      remoteRef: {key: /multi-tenant/prod/tenant-a/flask-secret}
