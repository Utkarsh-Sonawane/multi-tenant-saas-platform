apiVersion: v1
kind: Service
metadata:
  name: tenant-b-service
  namespace: tenant-b
  labels:
    app: multi-tenant-saas
    tenant: tenant-b
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/healthz"
spec:
  type: ClusterIP
  selector:
    app: multi-tenant-saas
    tenant: tenant-b
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
