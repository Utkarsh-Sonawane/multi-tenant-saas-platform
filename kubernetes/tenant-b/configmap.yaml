apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-b-config
  namespace: tenant-b
  labels:
    app: multi-tenant-saas
    tenant: tenant-b
data:
  CONFIG_DB_PORT: "5432"
  CONFIG_DB_NAME: "config_db"
  CONFIG_DB_USER: "config_user"
  DB_PORT:        "5432"
  DEPLOYED_TENANT_ID: "tenant-b"
  ENVIRONMENT:    "production"
  AWS_REGION:     "ap-south-1"
  K8S_NAMESPACE:  "tenant-b"
  PORT:           "5000"
  WORKERS:        "4"
  WORKER_CLASS:   "gthread"
  THREADS:        "2"
  TIMEOUT:        "120"
  FLASK_DEBUG:    "false"
