apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bootstrap-parameter-store
  namespace: tenant-a
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: db-bootstrap-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-bootstrap-credentials
  namespace: tenant-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bootstrap-parameter-store
    kind: SecretStore
  target:
    name: db-bootstrap-credentials
    creationPolicy: Owner
  data:
    - secretKey: RDS_HOST
      remoteRef: {key: /myapp/prod/rds_endpoint}
    - secretKey: RDS_MASTER_USER
      remoteRef: {key: /multi-tenant/prod/rds/master/username}
    - secretKey: RDS_MASTER_PASSWORD
      remoteRef: {key: /multi-tenant/prod/rds/master/password}
    - secretKey: CONFIG_DB_PASSWORD
      remoteRef: {key: /multi-tenant/prod/config-db/password}
    - secretKey: TENANT_A_DB_PASSWORD
      remoteRef: {key: /multi-tenant/prod/tenant-a/db/password}
    - secretKey: TENANT_B_DB_PASSWORD
      remoteRef: {key: /multi-tenant/prod/tenant-b/db/password}
    - secretKey: TENANT_C_DB_PASSWORD
      remoteRef: {key: /multi-tenant/prod/tenant-c/db/password}
