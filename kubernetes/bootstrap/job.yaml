apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  namespace: tenant-a
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: db-bootstrap-secrets-reader
      containers:
        - name: bootstrap
          image: REPLACE_WITH_ECR_URI:bootstrap
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: db-bootstrap-config}
            - secretRef: {name: db-bootstrap-credentials}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
