apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-c-secrets-reader
  namespace: tenant-c
  annotations: {eks.amazonaws.com/role-arn: REPLACE_WITH_TENANT_C_IRSA_ROLE_ARN}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: tenant-c-parameter-store, namespace: tenant-c}
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
      auth: {jwt: {serviceAccountRef: {name: tenant-c-secrets-reader}}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: tenant-c-runtime, namespace: tenant-c}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: tenant-c-parameter-store, kind: SecretStore}
  target: {name: tenant-c-secrets, creationPolicy: Owner}
  data:
    - secretKey: CONFIG_DB_HOST
      remoteRef: {key: /myapp/prod/rds_endpoint}
    - secretKey: CONFIG_DB_PASSWORD
      remoteRef: {key: /multi-tenant/prod/config-db/password}
    - secretKey: DB_HOST
      remoteRef: {key: /myapp/prod/rds_endpoint}
    - secretKey: DB_USER
      remoteRef: {key: /multi-tenant/prod/tenant-c/db/username}
    - secretKey: DB_PASSWORD
      remoteRef: {key: /multi-tenant/prod/tenant-c/db/password}
    - secretKey: SECRET_KEY
      remoteRef: {key: /multi-tenant/prod/tenant-c/flask-secret}
