# ============================================================
# ingress-alb.yaml — AWS ALB Ingress for EKS Auto Mode
#
# EKS Auto Mode automatically manages the AWS load balancer.
# No AWS Load Balancer Controller installation is required.
# No Helm installation is required.
#
# Apply:
#   kubectl apply -f kubernetes/ingress-alb.yaml
#
# Three namespace-local Ingress resources use the same
# IngressClass and ALB group.
# ============================================================

# ============================================================
# TENANT A
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-tenant-saas-ingress
  namespace: tenant-a
  labels:
    app: multi-tenant-saas
  annotations:
    alb.ingress.kubernetes.io/group.name: multi-tenant-saas
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=60,
      routing.http2.enabled=true,
      access_logs.s3.enabled=false

    alb.ingress.kubernetes.io/target-group-attributes: >-
      stickiness.enabled=false,
      deregistration_delay.timeout_seconds=30

    alb.ingress.kubernetes.io/tags: >-
      Environment=production,
      Project=multi-tenant-saas,
      ManagedBy=kubectl

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:

          # Tenant A
          - path: /tenant-a
            pathType: Prefix
            backend:
              service:
                name: tenant-a-service
                port:
                  number: 80

          # Default route
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenant-a-service
                port:
                  number: 80


