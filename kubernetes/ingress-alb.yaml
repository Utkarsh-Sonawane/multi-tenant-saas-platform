# ============================================================
# ingress-alb.yaml — AWS ALB Ingress for Multi-Tenant SaaS
#
# Prerequisites:
#   1. AWS Load Balancer Controller installed in the EKS cluster
#   2. An IAM OIDC provider associated with the cluster
# Apply: kubectl apply -f kubernetes/ingress-alb.yaml
#
# These three namespace-local Ingress resources share ONE Application
# Load Balancer through the AWS Load Balancer Controller group feature.
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-tenant-saas-ingress
  namespace: tenant-a
  labels:
    app: multi-tenant-saas
  annotations:
    # ── ALB Controller ──────────────────────────────────────
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: multi-tenant-saas
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # ── HTTP ────────────────────────────────────────────────
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # ── Health check ────────────────────────────────────────
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds:  "5"
    alb.ingress.kubernetes.io/healthy-threshold-count:      "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count:    "3"

    # ── Load balancer attributes ─────────────────────────────
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=60,
      routing.http2.enabled=true,
      access_logs.s3.enabled=false

    # ── Stickiness (optional) ────────────────────────────────
    alb.ingress.kubernetes.io/target-group-attributes: >-
      stickiness.enabled=false,deregistration_delay.timeout_seconds=30

    # ── Tags ─────────────────────────────────────────────────
    alb.ingress.kubernetes.io/tags: >-
      Environment=production,
      Project=multi-tenant-saas,
      ManagedBy=kubectl

spec:
  rules:
    - http:
        paths:

          # ── Tenant A — ABC Retail ─────────────────────────
          - path: /tenant-a
            pathType: Prefix
            backend:
              service:
                name: tenant-a-service
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenant-a-service
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-tenant-saas-ingress
  namespace: tenant-b
  labels:
    app: multi-tenant-saas
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: multi-tenant-saas
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/tags: Environment=production,Project=multi-tenant-saas,ManagedBy=kubectl
spec:
  rules:
    - http:
        paths:
          - path: /tenant-b
            pathType: Prefix
            backend:
              service:
                name: tenant-b-service
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-tenant-saas-ingress
  namespace: tenant-c
  labels:
    app: multi-tenant-saas
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: multi-tenant-saas
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/tags: Environment=production,Project=multi-tenant-saas,ManagedBy=kubectl
spec:
  rules:
    - http:
        paths:
          - path: /tenant-c
            pathType: Prefix
            backend:
              service:
                name: tenant-c-service
                port:
                  number: 80

